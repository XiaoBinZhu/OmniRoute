# ──────────────────────────────────────────────────────────────────────────────
#  Nginx front door for OmniRoute on a gateway host (43-class box)
# ──────────────────────────────────────────────────────────────────────────────
#
#  The Next.js runtime listens on 127.0.0.1:20130 (dashboard/HTTP) and
#  127.0.0.1:20131 (API); this file exposes it to the platform without ever
#  publishing those ports on the public interface.
#
#  Two supported modes — pick ONE block per host:
#
#   A) HEADLESS GATEWAY (recommended on 2 vCPU / 4 GB hosts)
#      The container runs with OMNIROUTE_HEADLESS=1 and an image built with
#      OMNIROUTE_BUILD_BACKEND_ONLY=1. Only /v1/* and /api/* exist; the dashboard
#      answers 404. Nginx proxies the API surface with SSE-safe settings.
#
#   B) FULL IMAGE (dashboard hosted by the same container)
#      The container runs the default (full) image. Nginx additionally proxies
#      the dashboard pages. There is no static-only dashboard build — the App
#      Router pages are server components, so the UI cannot be exported to
#      plain files (see docs/ops/PROC_HEADLESS_DEPLOY.md § "Why the dashboard is
#      not a static bundle"). Serving the UI from Nginx therefore still means
#      proxying page requests to the container.
#
#  Place at /etc/nginx/conf.d/omniroute.conf (or include from a server block),
#  then: nginx -t && systemctl reload nginx
#
#  Streaming matters: LLM responses are chunked SSE. Buffering turned on adds
#  latency and can break token streaming, so every proxy block below disables it.
# ──────────────────────────────────────────────────────────────────────────────

upstream omniroute_http {
    server 127.0.0.1:20130;
    keepalive 32;
}

upstream omniroute_api {
    server 127.0.0.1:20131;
    keepalive 32;
}

# Shared proxy defaults for the LLM surface.
# (Map-based Connection upgrade so the same block works for SSE + WS.)
map $http_upgrade $omniroute_connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    # Replace with the host that terminates TLS for the gateway.
    server_name omniroute.internal.example.com;

    # AI request bodies: vision/image payloads are multi-MB.
    client_max_body_size 512m;
    client_body_timeout 300s;

    # ── A) HEADLESS GATEWAY — OpenAI-compatible API ──────────────────────────
    location /v1/ {
        proxy_pass http://omniroute_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        add_header X-Accel-Buffering no;
    }

    # ── A/B) Management API (used by the platform and the omniroute CLI) ─────
    # Keep this loopback/VPN-only in production: the management surface can
    # mint API keys and mutate providers.
    location /api/ {
        # allow 10.0.0.0/8;  allow 172.16.0.0/12;  allow 192.168.0.0/16;
        # deny all;
        proxy_pass http://omniroute_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection $omniroute_connection_upgrade;
        proxy_set_header Upgrade $http_upgrade;
        proxy_buffering off;
        proxy_read_timeout 600s;
    }

    location = /healthz {
        proxy_pass http://omniroute_http/healthz;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        access_log off;
    }

    # ── B) FULL IMAGE ONLY — dashboard pages ─────────────────────────────────
    # Enable this block only when the container runs the full image
    # (OMNIROUTE_HEADLESS=0). With a headless core container these paths answer
    # 404 by design, and proxying them just moves the 404 one hop.
    #
    # location /omniroute/ {
    #     proxy_pass http://omniroute_http/;
    #     proxy_http_version 1.1;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    #     proxy_set_header Connection $omniroute_connection_upgrade;
    #     proxy_set_header Upgrade $http_upgrade;
    #     proxy_buffering off;
    #     proxy_read_timeout 600s;
    # }
    #
    # # Next.js immutable build assets — safe to cache aggressively.
    # location /omniroute/_next/static/ {
    #     proxy_pass http://omniroute_http/_next/static/;
    #     proxy_set_header Host $host;
    #     proxy_cache_valid 200 30d;
    #     expires 30d;
    #     add_header Cache-Control "public, max-age=31536000, immutable";
    # }
    #
    # # Live dashboard WebSocket (full image only; headless skips the daemon).
    # location /omniroute/live-ws {
    #     proxy_pass http://127.0.0.1:20132;
    #     proxy_http_version 1.1;
    #     proxy_set_header Upgrade $http_upgrade;
    #     proxy_set_header Connection $omniroute_connection_upgrade;
    #     proxy_read_timeout 3600s;
    # }
}
