name: deploy-proc-image

# 仅为 MaaS 平台部署 OmniRoute 生产镜像：构建 runner-base 并推送 GHCR。
# 43 机（3.7GB）无法现场构建 Next 产物，必须由 CI 构建后拉取。
on:
  push:
    branches: [proc]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-proc-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        run: echo "tag=proc-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runner-base
          push: true
          build-args: |
            OMNIROUTE_USE_TURBOPACK=0
            OMNIROUTE_BUILD_MEMORY_MB=6144
            OMNIROUTE_BUILD_WORKERS=2
          tags: |
            ghcr.io/${{ github.repository_owner }}/omniroute:${{ steps.meta.outputs.tag }}
            ghcr.io/${{ github.repository_owner }}/omniroute:proc
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          echo "image=ghcr.io/${{ github.repository_owner }}/omniroute:${{ steps.meta.outputs.tag }}" >> "$GITHUB_STEP_SUMMARY"
          echo "digest=${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
